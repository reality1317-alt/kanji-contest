<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第3回 漢字コンクール攻略</title><style>body{margin:0;background:#f5f5f5;color:#222;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{max-width:740px;margin:auto;padding:22px 16px}h1{font-size:25px;margin:14px 0 5px}.sub{color:#666}.panel{background:white;border-radius:25px;padding:24px;margin-top:22px;box-shadow:0 3px 18px #0000000a}.row{display:flex;gap:9px;flex-wrap:wrap}button,select{font:inherit;border:0;border-radius:14px;padding:15px;cursor:pointer}button{font-weight:700}select{background:#eee}.primary{background:#222;color:white;width:100%;font-size:19px}.secondary{background:#eee}.score{flex:1;min-width:90px}.good{background:#def5e5}.mid{background:#fff0c8}.bad{background:#ffe0e0}.question{font-size:clamp(22px,5vw,31px);line-height:1.8;min-height:150px;margin:35px 0 18px}.answer{font-size:30px;font-weight:800;color:#147b46;margin:14px 0 24px}.hidden{display:none}.progress{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin-top:18px}.bar{height:100%;background:#333;width:0}.tag{color:#777}.small{font-size:13px;color:#666;line-height:1.7}</style></head><body><main class="wrap"><h1>第3回 漢字コンクール攻略</h1><div class="sub">小4｜答えを見て ○・△・× で自己採点</div><section class="panel" id="home"><h2>練習をはじめる</h2><p>問題のカタカナを漢字で書いてみよう。</p><div class="row"><label>問題数 <select id="count"><option value="10">10問</option><option value="20">20問</option><option value="50">50問</option><option value="100">100問</option></select></label><label>出題順 <select id="order"><option value="shuffle">シャッフル</option><option value="seq">練習問題A順</option><option value="review">△・×の復習</option></select></label></div><p class="small">Aの100問を収録。Bは同じ漢字を異なる順番で練習する構成です。<br>元プリントの文章と一部表現が異なる可能性があります。答えはPDFの模範解答欄を優先してください。</p><button class="primary" id="start">練習スタート</button></section><section class="panel hidden" id="quiz"><div class="row" style="justify-content:space-between"><span class="tag" id="num"></span><span class="tag" id="pos"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><button class="primary" id="reveal">答えを見る</button><div id="after" class="hidden"><div class="tag">正解</div><div class="answer" id="answer"></div><div class="row"><button class="score good" data-s="o">○ すぐ出た</button><button class="score mid" data-s="m">△ 迷った</button><button class="score bad" data-s="x">× わからない</button></div></div><p><button class="secondary" id="stop">途中で終了</button></p></section><section class="panel hidden" id="result"><h2>おつかれさま！</h2><p id="summary"></p><button class="primary" id="again">もう一度練習</button></section></main><script>const DATA=[{"n": 1, "q": "現在いるイチを確かめる。", "a": "位置"}, {"n": 2, "q": "モノオキに荷物をしまう。", "a": "物置"}, {"n": 3, "q": "親しいナカマがいる。", "a": "仲間"}, {"n": 4, "q": "オキナワの歴史を学ぶ。", "a": "沖縄"}, {"n": 5, "q": "病気のチョウコウがある。", "a": "兆候"}, {"n": 6, "q": "海面よりヒクイ土地。", "a": "低い"}, {"n": 7, "q": "学力のテイカを防ぐ。", "a": "低下"}, {"n": 8, "q": "ソコヂカラを出す。", "a": "底力"}, {"n": 9, "q": "コンテイから考え直す。", "a": "根底"}, {"n": 10, "q": "マトハズレな意見を言う。", "a": "的外れ"}, {"n": 11, "q": "明確なモクテキを持つ。", "a": "目的"}, {"n": 12, "q": "国語ジテンで調べる。", "a": "辞典"}, {"n": 13, "q": "中国から漢字がツタワル。", "a": "伝わる"}, {"n": 14, "q": "エジソンのデンキを読む。", "a": "伝記"}, {"n": 15, "q": "駅までトホで五分かかる。", "a": "徒歩"}, {"n": 16, "q": "成績向上にツトメル。", "a": "努める"}, {"n": 17, "q": "長年のドリョクが実る。", "a": "努力"}, {"n": 18, "q": "ショウトウ時刻がすぎる。", "a": "消灯"}, {"n": 19, "q": "ハタラキざかりの人。", "a": "働き"}, {"n": 20, "q": "ジツドウ時間を調べる。", "a": "実働"}, {"n": 21, "q": "トクテイの条件を満たす。", "a": "特定"}, {"n": 22, "q": "ドウトクの授業を受ける。", "a": "道徳"}, {"n": 23, "q": "日光はトチギ県にある。", "a": "栃木"}, {"n": 24, "q": "母はカナガワ県出身だ。", "a": "神奈川"}, {"n": 25, "q": "ヤマナシ県には山が多い。", "a": "山梨"}, {"n": 26, "q": "アツイ湯を注ぐ。", "a": "熱い"}, {"n": 27, "q": "ネッタイに育つ植物。", "a": "熱帯"}, {"n": 28, "q": "試合に負けてザンネンだ。", "a": "残念"}, {"n": 29, "q": "決勝戦でヤブレル。", "a": "敗れる"}, {"n": 30, "q": "シッパイを恐れない。", "a": "失敗"}, {"n": 31, "q": "バイリンで花を見る。", "a": "梅林"}, {"n": 32, "q": "ウメのつぼみがふくらむ。", "a": "梅"}, {"n": 33, "q": "ハクブツカンを見学する。", "a": "博物館"}, {"n": 34, "q": "オオサカジョウを見学する。", "a": "大阪城"}, {"n": 35, "q": "ハンシンで野球を観戦する。", "a": "阪神"}, {"n": 36, "q": "ヒルメシを食べる。", "a": "昼飯"}, {"n": 37, "q": "家族でユウハンを食べる。", "a": "夕飯"}, {"n": 38, "q": "ヒコウキに乗る。", "a": "飛行機"}, {"n": 39, "q": "ヒコウキが空をトブ。", "a": "飛ぶ"}, {"n": 40, "q": "力士がヒッシに戦う。", "a": "必死"}, {"n": 41, "q": "カナラズ合格すると信じる。", "a": "必ず"}, {"n": 42, "q": "デンピョウの整理をする。", "a": "伝票"}, {"n": 43, "q": "モクヒョウを達成する。", "a": "目標"}, {"n": 44, "q": "何のフアンもない。", "a": "不安"}, {"n": 45, "q": "スイフが船に乗る。", "a": "水夫"}, {"n": 46, "q": "私のオットは画家です。", "a": "夫"}, {"n": 47, "q": "庭に葉がフチャクする。", "a": "付着"}, {"n": 48, "q": "画面にホコリがツク。", "a": "付く"}, {"n": 49, "q": "四十七トドウフケン。", "a": "都道府県"}, {"n": 50, "q": "ギフ県は内陸県だ。", "a": "岐阜"}, {"n": 51, "q": "トヤマ県へ旅行する。", "a": "富山"}, {"n": 52, "q": "政府のフコク強兵政策。", "a": "富国"}, {"n": 53, "q": "薬のフクサヨウに注意する。", "a": "副作用"}, {"n": 54, "q": "おもちゃのヘイタイ。", "a": "兵隊"}, {"n": 55, "q": "ゴミをブンベツする。", "a": "分別"}, {"n": 56, "q": "転校する友人とワカレル。", "a": "別れる"}, {"n": 57, "q": "ミズベでキャンプする。", "a": "水辺"}, {"n": 58, "q": "我が家のアタリは緑が多い。", "a": "辺り"}, {"n": 59, "q": "気温のヘンカが激しい。", "a": "変化"}, {"n": 60, "q": "昔と街並みがカワル。", "a": "変わる"}, {"n": 61, "q": "駅が遠くてフベンを感じる。", "a": "不便"}, {"n": 62, "q": "いとこからタヨリが来る。", "a": "便り"}, {"n": 63, "q": "島物をホウイする。", "a": "包囲"}, {"n": 64, "q": "品物をつつむ。", "a": "包む"}, {"n": 65, "q": "新しいホウホウを試す。", "a": "方法"}, {"n": 66, "q": "人は幸福をノゾム。", "a": "望む"}, {"n": 67, "q": "最後までキボウを持つ。", "a": "希望"}, {"n": 68, "q": "羊のホウボクをする。", "a": "放牧"}, {"n": 69, "q": "物語のケツマツを語る。", "a": "結末"}, {"n": 70, "q": "マンゾクするまで遊ぶ。", "a": "満足"}, {"n": 71, "q": "希望にミチタ若者たち。", "a": "満ちた"}, {"n": 72, "q": "マングルするまで遊ぶ。", "a": "満足"}, {"n": 73, "q": "ミチの世界にあこがれる。", "a": "未知"}, {"n": 74, "q": "広くコクミンの意見を聞く。", "a": "国民"}, {"n": 75, "q": "雲一つナイ青空が広がる。", "a": "無い"}, {"n": 76, "q": "そんな心配はムヨウだ。", "a": "無用"}, {"n": 77, "q": "明日のヤクソクをする。", "a": "約束"}, {"n": 78, "q": "イサマシイ行動を取る。", "a": "勇ましい"}, {"n": 79, "q": "ユウキある行動をとる。", "a": "勇気"}, {"n": 80, "q": "ヨウヤクして伝える。", "a": "要約"}, {"n": 81, "q": "親が子をヤシナウ。", "a": "養う"}, {"n": 82, "q": "エイヨウのある食べ物。", "a": "栄養"}, {"n": 83, "q": "みんなの注目をアビル。", "a": "浴びる"}, {"n": 84, "q": "シンリンヨクをする。", "a": "森林浴"}, {"n": 85, "q": "貯金にリシがつく。", "a": "利子"}, {"n": 86, "q": "南極タイリクを横断する。", "a": "大陸"}, {"n": 87, "q": "経過はリョウコウだ。", "a": "良好"}, {"n": 88, "q": "二人は仲のヨイ姉妹だ。", "a": "良い"}, {"n": 89, "q": "サラダのザイリョウ。", "a": "材料"}, {"n": 90, "q": "ウリョウが多い地域。", "a": "雨量"}, {"n": 91, "q": "水の重さをハカル。", "a": "量る"}, {"n": 92, "q": "リンショウをする。", "a": "輪唱"}, {"n": 93, "q": "ケーキを買うためのユビワ。", "a": "指輪"}, {"n": 94, "q": "ケーキを買うためにユビワを売る。", "a": "指輪"}, {"n": 95, "q": "大雨警報がハツレイする。", "a": "発令"}, {"n": 96, "q": "ツメタイ水を飲む。", "a": "冷たい"}, {"n": 97, "q": "スープがサメル。", "a": "冷める"}, {"n": 98, "q": "カンレイな気候の土地。", "a": "寒冷"}, {"n": 99, "q": "タトエバ、こんな場合。", "a": "例えば"}, {"n": 100, "q": "レイネン通り祭りを行う。", "a": "例年"}];let deck=[],idx=0,stats={o:0,m:0,x:0};const $=id=>document.getElementById(id);const stored=()=>{try{return JSON.parse(localStorage.getItem('kanji_contest_review')||'{}')}catch{return {}}};function start(){let order=$('order').value,all=[...DATA];if(order==='review'){let bad=stored();all=all.filter(x=>bad[x.n]);if(!all.length){alert('まだ復習する問題がありません。');return}}if(order!=='seq')all.sort(()=>Math.random()-.5);deck=all.slice(0,Number($('count').value));idx=0;stats={o:0,m:0,x:0};$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');next()}function next(){if(idx>=deck.length){finish();return}let x=deck[idx];$('num').textContent='練習問題A '+x.n+'番';$('pos').textContent=(idx+1)+' / '+deck.length;$('bar').style.width=(idx/deck.length*100)+'%';$('question').textContent=x.q;$('answer').textContent=x.a;$('after').classList.add('hidden');$('reveal').classList.remove('hidden')}function rate(s){stats[s]++;let x=deck[idx],bad=stored();if(s==='o')delete bad[x.n];else bad[x.n]=true;try{localStorage.setItem('kanji_contest_review',JSON.stringify(bad))}catch{}idx++;next()}function finish(){ $('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('summary').textContent='○ '+stats.o+'問 ／ △ '+stats.m+'問 ／ × '+stats.x+'問';$('bar').style.width='100%'}$('start').onclick=start;$('reveal').onclick=()=>{$('reveal').classList.add('hidden');$('after').classList.remove('hidden')};document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>rate(b.dataset.s));$('stop').onclick=finish;$('again').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')};</script></body></html>
